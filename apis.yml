  - type: Features
    data:
      - name: Twelve sport APIs
        description: >-
          Football, basketball, NBA, baseball, American football (NFL and NCAA),
          Formula 1, ice hockey, handball, rugby, volleyball, MMA and AFL, each a
          separately versioned host.
      - name: Real-time live scores
        description: Live score updates, fixture statuses and in-play event data across the supported sports.
      - name: Historical data
        description: Multi-season historical results, player statistics and standings.
      - name: One key across every sport
        description: >-
          A single x-apisports-key works for every sport API the account subscribes
          to; there are no scopes or per-service credentials.
      - name: Embeddable widgets
        description: >-
          A first-party widget library renders games and standings for seven sports
          from data- attributes, with no client code to write.
      - name: Two rate-limit windows
        description: >-
          A per-day quota and a per-minute rate, each signalled by its own response
          header family; logo and image calls do not count against the daily quota.
      - name: RapidAPI distribution
        description: The same APIs are resold through the RapidAPI marketplace under RapidAPI billing and quota.
  - type: UseCases
    data:
      - name: Sports betting platforms
        description: Integrate live scores, odds data and historical statistics to power betting applications.
      - name: Fantasy sports apps
        description: Build fantasy platforms with real-time player statistics, injury data and performance metrics.
      - name: Sports news portals
        description: Automate sports content with live scores, match results and team standings.
      - name: Sports analytics
        description: Analyse historical data, player statistics and match performance.
      - name: Mobile sports apps
        description: Build companion apps with live scores, notifications and statistics dashboards.
      - name: Embedded scoreboards
        description: >-
          Drop live game and standings widgets into an existing site or CMS without
          writing an integration.
