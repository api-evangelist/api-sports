gaps:
  - >-
    Entries are not versioned. A post announcing "a new release of API-Football" does
    not carry a version number a client can pin to, and the host label (v3) has not
    changed across several such releases.
  - >-
    Breaking versus additive is never declared. Nothing in the taxonomy separates a
    compatible addition from a change that would break an existing integration.
  - >-
    There is no machine-readable feed, so following changes requires scraping a host
    that returns 403 to automated clients.
