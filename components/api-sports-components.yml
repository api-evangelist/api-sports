specification: API Evangelist Embedded Components
specificationVersion: '0.1'
provider: API-Sports
providerId: api-sports
description: >-
  API-Sports ships a first-party embeddable widget library — drop-in HTML elements
  that render live games and standings for eight sports directly from a page, driven
  entirely by data- attributes and an API key. This is a distinct product surface from
  the REST APIs and from any SDK: no client code is written, the loader calls the API
  itself. The component and attribute inventory below was read from the provider's own
  minified bundle on its CDN, not from documentation.
distribution:
  registry: cdn
  cdn: widgets.api-sports.io (BunnyCDN, CNAME widgets-api-sports.b-cdn.net)
  loader: https://widgets.api-sports.io/2.0.3/widgets.js
  stylesheet: https://widgets.api-sports.io/2.0.3/widgets.css
  version: 2.0.3
  pinned: true
  note: >-
    The distribution URL is version-pinned by path segment, so a consumer knows
    exactly what they are loading. There is no unpinned "latest" alias and no npm
    package — probing widgets.api-sports.io/widgets.js and /2.0.0/widgets.js both
    returned 404, so 2.0.3 is the only build addressable at this path shape.
  builder: https://www.api-football.com/news/post/introducing-the-api-sports-widget-builder
