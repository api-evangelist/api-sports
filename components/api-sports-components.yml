security_note: >-
  Because the widget runs in the browser, data-key places a live API key in page
  source. The provider publishes a dedicated note on restricting keys by IP or domain
  (https://www.api-football.com/news/post/allow-only-certain-ipsdomains-to-call-the-apis)
  and a widget cache-and-security tutorial
  (https://www.api-football.com/news/post/how-to-optimize-widgets-cache-and-security-tutorial).
  Anyone embedding these components should scope the key before shipping.
