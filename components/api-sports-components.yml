configuration_attributes:
  - name: data-key
    purpose: The API-Sports application key. Read by the loader and sent to the API from the browser.
  - name: data-host
    purpose: The API host the widget calls (selects direct vs marketplace routing).
  - name: data-sport
    purpose: Sport selector where a widget serves more than one.
  - name: data-league
    purpose: League identifier.
  - name: data-season
    purpose: Season identifier.
  - name: data-team
    purpose: Team identifier.
  - name: data-date
    purpose: Date filter for the games listing.
  - name: data-status
    purpose: Fixture status filter.
  - name: data-refresh
    purpose: Auto-refresh interval for live data.
  - name: data-theme
    purpose: Light/dark or custom theme selection.
  - name: data-show-logos
    purpose: Toggle team/competition logos.
  - name: data-show-toolbar
    purpose: Toggle the widget toolbar.
  - name: data-show-errors
    purpose: Surface API errors inside the widget rather than failing silently.
  - name: data-modal
    purpose: Enable the detail modal.
  - name: data-modal-game
    purpose: Open the game detail view in the modal.
  - name: data-modal-standings
    purpose: Open standings in the modal.
  - name: data-modal-show-logos
