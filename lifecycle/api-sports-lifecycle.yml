versioning:
  scheme: major-version-in-hostname
  detail: >-
    Each sport is a separately versioned API whose major version is a DNS label:
    v3.football.api-sports.io, v2.nba.api-sports.io, v1.<sport>.api-sports.io. A
    version bump therefore means a new hostname, and there is no negotiated or
    default-latest alias.
  current_versions:
    football: v3
    nba: v2
    basketball: v1
    baseball: v1
    american-football: v1
    formula-1: v1
    hockey: v1
    handball: v1
    rugby: v1
    volleyball: v1
    mma: v1
    afl: v1
    widgets: v3 (documentation/widgets/v3)
  verified: probed
  evidence: >-
    All twelve sport hosts answered on 2026-09-02 with the API's own JSON envelope.
    Older or alternate labels do not resolve: v1.nba.api-sports.io,
    v3.tennis.api-sports.io, v1.tennis.api-sports.io, v1.cricket.api-sports.io and
    v1.golf.api-sports.io are all NXDOMAIN.
