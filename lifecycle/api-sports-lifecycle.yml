status_page:
  configured: true
  serving: false
  url: https://status.api-sports.io/
  vendor: Better Stack (Better Uptime)
  dns: status.api-sports.io CNAME statuspage.betteruptime.com -> 167.235.220.62
  http_status: null
  error: 'TLS handshake failure: tlsv1 alert internal error'
  finding: >-
    API-Sports has provisioned a Better Uptime status page and pointed
    status.api-sports.io at it, but the TLS certificate for the custom domain is not
    being served — every HTTPS connection is aborted by the vendor during the
    handshake, from two independent clients on 2026-09-02. Plain HTTP 308-redirects to
    the HTTPS URL that then fails, so the page is unreachable by any means. This is a
    broken deployment, not an absent one; it is a small fix on the provider's side.
    No StatusPage pointer is emitted while it does not serve, because a pointer to an
    unreachable page is a claim we would be making on the provider's behalf.
  evidence:
    - url: https://status.api-sports.io/
      status: null
      error: TLSV1_ALERT_INTERNAL_ERROR
    - url: http://status.api-sports.io/
      status: 308
