content_signal:
  present: true
  hosts:
    - host: api-sports.io
      file: api-sports-robots.txt
      directive: 'Content-Signal: search=yes, ai-input=yes, ai-train=yes'
      status: 200
    - host: www.api-football.com
      file: api-sports-api-football-robots.txt
      directive: 'Content-Signal: search=yes, ai-input=yes, ai-train=yes'
      status: 200
  interpretation: >-
    Both public web hosts publish a Cloudflare Content Signals Policy that explicitly
    permits search indexing, AI input (RAG / grounding at inference time) and AI
    training. robots.txt itself is Allow: / for User-agent: *. This is an opt-IN
    consent declaration and is the provider's only machine-readable agent-consent
    document.
  contradiction: >-
    The stated policy and the deployed edge disagree. robots.txt allows every agent,
    but every HTML page on api-sports.io and www.api-football.com answers our crawler
    with HTTP 403 from a Cloudflare bot-management challenge regardless of
    User-Agent (browser, Googlebot). Static files under the same hosts (robots.txt,
    sitemap.xml) return 200. An agent that honours the published policy still cannot
    read the documentation, pricing or terms pages that policy invites it to read.
