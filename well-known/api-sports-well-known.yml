description: >-
  Probe record of the IETF/industry well-known document paths on every API-Sports
  host. Every /.well-known/ path 404s or is refused by the API edge, so NO WellKnown
  or SecurityTxt pointer is emitted for this provider — this file records a verified
  absence, not a presence. The one machine-readable consent document API-Sports does
  publish is a Cloudflare Content Signals Policy line inside robots.txt on both
  public web hosts, saved verbatim alongside this index.
